# 전체 실행: docker compose up --build
# 접속: http://localhost  (front → back → ai 순서로 연결)
name: mido

services:
  db:
    # [원본 보존 주석]: 이전 기본 이미지 (pgvector 미포함)
    # image: postgres:16-alpine
    # [v2.1.0 마이그레이션]: pgvector 벡터 검색 확장이 활성화된 공식 이미지로 교체
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: mido
      POSTGRES_USER: mido
      POSTGRES_PASSWORD: ${DB_PASSWORD:?.env 에 DB_PASSWORD 를 넣어 주세요}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mido -d mido"]
      interval: 5s
      retries: 20

  ai:
    build: ./ai
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: mido
      POSTGRES_USER: mido
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  back:
    build: ./back
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/mido
      SPRING_DATASOURCE_USERNAME: mido
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      APP_AI_BASE_URL: http://ai:8000
    depends_on:
      db:
        condition: service_healthy
      ai:
        condition: service_started
    restart: unless-stopped

  front:
    build: ./front
    ports:
      - "80:80"
    depends_on:
      - back
    restart: unless-stopped

volumes:
  db-data:
